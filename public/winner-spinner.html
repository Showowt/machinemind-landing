<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MachineMind — Dream Selector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,600;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void: #050508;
    --surface: #0a0a12;
    --deep-blue: #0066CC;
    --core-blue: #00B4FF;
    --bright-blue: #00D4FF;
    --gold: #FFD700;
    --white: #FFFFFF;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
  }

  body {
    color: var(--white);
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    background: var(--void);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ═══ CINEMATIC AMBIENT ═══ */
  .ambient-pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150vmax;
    height: 150vmax;
    background: radial-gradient(ellipse at center,
      rgba(0,102,204,0.08) 0%,
      rgba(0,180,255,0.03) 30%,
      transparent 60%
    );
    animation: ambientBreathe 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes ambientBreathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 50;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,180,255,0.015) 2px,
      rgba(0,180,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 51;
    animation: scanMove 8s linear infinite;
  }

  @keyframes scanMove {
    from { background-position: 0 0; }
    to { background-position: 0 100px; }
  }

  /* ═══ HEADER ═══ */
  .header {
    position: absolute;
    top: 3vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 60;
    opacity: 0;
    animation: fadeSlideDown 1s ease 0.5s forwards;
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .logo-mark {
    width: 36px;
    height: 36px;
  }

  .wordmark {
    font-weight: 600;
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--white);
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 14px;
    border-radius: 100px;
    margin-left: 12px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: #ff3b3b;
    border-radius: 50%;
    animation: livePulse 1.5s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.6); }
    50% { box-shadow: 0 0 0 6px rgba(255,59,59,0); }
  }

  /* ═══ TITLE ═══ */
  .title-zone {
    position: absolute;
    top: 10vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 60;
    opacity: 0;
    animation: fadeSlideDown 1s ease 0.8s forwards;
  }

  .eyebrow {
    font-size: clamp(10px, 1.5vw, 13px);
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--core-blue);
    margin-bottom: 8px;
  }

  .title {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  .title .accent {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--bright-blue);
    display: inline-block;
    animation: titleGlow 3s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 20px rgba(0,212,255,0.3); }
    50% { text-shadow: 0 0 40px rgba(0,212,255,0.6), 0 0 80px rgba(0,212,255,0.3); }
  }

  /* ═══ WHEEL ZONE ═══ */
  .wheel-zone {
    position: relative;
    width: min(75vw, 75vh, 500px);
    height: min(75vw, 75vh, 500px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: wheelEntry 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
  }

  @keyframes wheelEntry {
    from { opacity: 0; transform: scale(0.8) rotate(-180deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,180,255,0.1);
    animation: orbitPulse 4s ease-in-out infinite;
  }

  .orbit-1 { width: 110%; height: 110%; animation-delay: 0s; }
  .orbit-2 { width: 125%; height: 125%; animation-delay: 1s; }
  .orbit-3 { width: 140%; height: 140%; animation-delay: 2s; opacity: 0.5; }

  @keyframes orbitPulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.02); opacity: 0.6; }
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.8));
  }

  .pointer-shape {
    width: 0;
    height: 0;
    border-left: min(4vw, 20px) solid transparent;
    border-right: min(4vw, 20px) solid transparent;
    border-top: min(7vw, 35px) solid var(--core-blue);
  }

  .pointer-glow {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: var(--bright-blue);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--bright-blue), 0 0 40px var(--bright-blue);
    animation: pointerGlow 1s ease-in-out infinite;
  }

  @keyframes pointerGlow {
    0%, 100% { box-shadow: 0 0 20px var(--bright-blue), 0 0 40px var(--bright-blue); }
    50% { box-shadow: 0 0 30px var(--bright-blue), 0 0 60px var(--bright-blue), 0 0 80px var(--core-blue); }
  }

  /* Wheel */
  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    will-change: transform;
    filter: drop-shadow(0 0 30px rgba(0,180,255,0.2));
  }

  .wheel.spinning {
    transition: transform 8s cubic-bezier(0.15, 0.6, 0.1, 1);
  }

  .wheel svg {
    width: 100%;
    height: 100%;
  }

  /* Center Hub */
  .center-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 18%;
    height: 18%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #15151f, var(--void));
    border: 2px solid rgba(0,180,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    box-shadow: 0 0 40px rgba(0,180,255,0.3), inset 0 0 30px rgba(0,0,0,0.8);
  }

  .hub-text {
    font-weight: 800;
    font-size: clamp(14px, 3vw, 24px);
    background: linear-gradient(135deg, var(--core-blue), var(--bright-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ═══ SPIN BUTTON ═══ */
  .spin-zone {
    position: absolute;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 60;
    opacity: 0;
    animation: fadeSlideUp 1s ease 1.5s forwards;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(30px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .spin-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: clamp(16px, 3vw, 24px) clamp(40px, 8vw, 70px);
    border: 2px solid var(--core-blue);
    border-radius: 100px;
    background: linear-gradient(135deg, rgba(0,102,204,0.2), rgba(0,180,255,0.1));
    color: var(--white);
    font-family: 'Outfit', sans-serif;
    font-size: clamp(14px, 2.5vw, 20px);
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 40px rgba(0,180,255,0.2), inset 0 0 20px rgba(0,180,255,0.1);
    animation: btnPulse 2s ease-in-out infinite;
    outline: none;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(0,180,255,0.2), inset 0 0 20px rgba(0,180,255,0.1); }
    50% { box-shadow: 0 0 60px rgba(0,180,255,0.4), inset 0 0 30px rgba(0,180,255,0.2); }
  }

  .spin-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 80px rgba(0,180,255,0.5), inset 0 0 30px rgba(0,180,255,0.2);
  }

  .spin-btn:active {
    transform: scale(0.98);
  }

  .spin-btn.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) scale(0.8);
    transition: all 0.5s ease;
  }

  .spin-icon {
    font-size: 1.4em;
    animation: iconSpin 4s linear infinite;
  }

  @keyframes iconSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .tap-hint {
    margin-top: 12px;
    font-size: clamp(10px, 1.5vw, 12px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 300;
  }

  /* ═══ WINNER REVEAL ═══ */
  .winner-zone {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
  }

  .winner-zone.revealed {
    animation: winnerReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes winnerReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.8); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  .winner-label {
    font-size: clamp(11px, 1.8vw, 14px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  .winner-name {
    font-size: clamp(48px, 12vw, 90px);
    font-weight: 900;
    letter-spacing: -2px;
    color: var(--white);
    text-shadow: 0 0 60px rgba(0,212,255,0.8), 0 0 120px rgba(0,180,255,0.4);
    animation: winnerPulse 1.5s ease-in-out infinite;
  }

  @keyframes winnerPulse {
    0%, 100% { text-shadow: 0 0 60px rgba(0,212,255,0.8), 0 0 120px rgba(0,180,255,0.4); }
    50% { text-shadow: 0 0 80px rgba(0,212,255,1), 0 0 160px rgba(0,180,255,0.6), 0 0 200px rgba(255,215,0,0.3); }
  }

  .winner-tagline {
    font-size: clamp(14px, 2.5vw, 20px);
    color: rgba(255,255,255,0.6);
    font-weight: 300;
    font-style: italic;
    margin-top: 8px;
  }

  /* ═══ EFFECTS ═══ */
  .flash-overlay {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flash-overlay.flash {
    animation: flashBang 0.15s ease-out;
  }

  @keyframes flashBang {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
  }

  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 70;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
  }

  .particle.active {
    animation: particleExplode 2s ease-out forwards;
  }

  @keyframes particleExplode {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }

  .confetti {
    position: absolute;
    opacity: 0;
    transform-origin: center;
  }

  .confetti.active {
    animation: confettiFall var(--duration) ease-out forwards;
    animation-delay: var(--delay);
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(var(--rotation)); }
  }

  /* Screen shake */
  .container.shake {
    animation: screenShake 0.5s ease-out;
  }

  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-5px, -5px); }
    20% { transform: translate(5px, 5px); }
    30% { transform: translate(-5px, 5px); }
    40% { transform: translate(5px, -5px); }
    50% { transform: translate(-3px, -3px); }
    60% { transform: translate(3px, 3px); }
    70% { transform: translate(-2px, 2px); }
    80% { transform: translate(2px, -2px); }
    90% { transform: translate(-1px, -1px); }
  }

  /* Winner glow behind wheel */
  .winner-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120%;
    height: 120%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.3) 0%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }

  .winner-glow.active {
    animation: glowExpand 2s ease-out infinite;
  }

  @keyframes glowExpand {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(9px, 1.2vw, 11px);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    z-index: 60;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <div class="ambient-pulse"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="flash-overlay" id="flash"></div>
  <div class="particles" id="particles"></div>

  <!-- Header -->
  <div class="header">
    <svg class="logo-mark" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="28" stroke="url(#logoGrad)" stroke-width="1" opacity="0.4"/>
      <text x="30" y="35" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="16" fill="url(#logoGrad)">MM</text>
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="60" y2="60">
          <stop offset="0%" stop-color="#00B4FF"/>
          <stop offset="100%" stop-color="#00D4FF"/>
        </linearGradient>
      </defs>
    </svg>
    <span class="wordmark">MachineMind</span>
    <div class="live-badge">
      <div class="live-dot"></div>
      Live
    </div>
  </div>

  <!-- Title -->
  <div class="title-zone">
    <div class="eyebrow">Build Your Dream</div>
    <div class="title">Choosing the <span class="accent">Winner</span></div>
  </div>

  <!-- Wheel -->
  <div class="wheel-zone">
    <div class="orbit-ring orbit-1"></div>
    <div class="orbit-ring orbit-2"></div>
    <div class="orbit-ring orbit-3"></div>
    <div class="winner-glow" id="winnerGlow"></div>

    <div class="pointer">
      <div class="pointer-glow"></div>
      <div class="pointer-shape"></div>
    </div>

    <div class="wheel" id="wheel">
      <svg viewBox="0 0 400 400" id="wheelSvg"></svg>
    </div>

    <div class="center-hub">
      <span class="hub-text">MM</span>
    </div>
  </div>

  <!-- Spin Button -->
  <div class="spin-zone" id="spinZone">
    <button class="spin-btn" id="spinBtn">
      <span class="spin-icon">◎</span>
      Spin
    </button>
    <div class="tap-hint">Tap to reveal destiny</div>
  </div>

  <!-- Winner Reveal -->
  <div class="winner-zone" id="winnerZone">
    <div class="winner-label">★ Winner ★</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-tagline">Your dream becomes reality</div>
  </div>

  <div class="footer">MachineMind — Build Your Dream</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION — RIGGED TO LAND ON CALEB
// ═══════════════════════════════════════════════════════════

const WINNER_NAME = "Caleb";

const CONTESTANTS = [
  "Jered", "Ralu", "Randy", "Caleb", "Miguel", "Sybilla",
  "Khali", "James", "Travis", "Jorge", "Eva", "Valentina",
  "Marissa", "Maria", "Nicolle", "Marcus", "Isabella", "Nick"
];

// ═══════════════════════════════════════════════════════════

const CX = 200, CY = 200, R = 190, IR = 50;

function buildWheel() {
  const svg = document.getElementById('wheelSvg');
  const n = CONTESTANTS.length;
  const slice = (2 * Math.PI) / n;

  // Defs
  let defs = `<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;
  svg.innerHTML = defs;

  for (let i = 0; i < n; i++) {
    const start = i * slice - Math.PI / 2;
    const end = (i + 1) * slice - Math.PI / 2;

    // Outer arc points
    const x1 = CX + R * Math.cos(start);
    const y1 = CY + R * Math.sin(start);
    const x2 = CX + R * Math.cos(end);
    const y2 = CY + R * Math.sin(end);
    // Inner arc points
    const ix1 = CX + IR * Math.cos(start);
    const iy1 = CY + IR * Math.sin(start);
    const ix2 = CX + IR * Math.cos(end);
    const iy2 = CY + IR * Math.sin(end);

    const largeArc = slice > Math.PI ? 1 : 0;

    // Slice - all equal, no pre-highlighting
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const color = i % 2 === 0 ? '#0a1225' : '#0d1630';
    path.setAttribute('d', `M${ix1},${iy1} L${x1},${y1} A${R},${R} 0 ${largeArc} 1 ${x2},${y2} L${ix2},${iy2} A${IR},${IR} 0 ${largeArc} 0 ${ix1},${iy1} Z`);
    path.setAttribute('fill', color);
    path.setAttribute('stroke', 'rgba(0,180,255,0.15)');
    path.setAttribute('stroke-width', '1');
    svg.appendChild(path);

    // Text
    const textAngle = start + slice / 2;
    const textR = (R + IR) / 2 + 15;
    const tx = CX + textR * Math.cos(textAngle);
    const ty = CY + textR * Math.sin(textAngle);
    const rot = (textAngle * 180 / Math.PI) + 90;

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', tx);
    text.setAttribute('y', ty);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('transform', `rotate(${rot}, ${tx}, ${ty})`);
    text.setAttribute('font-family', 'Outfit, sans-serif');
    text.setAttribute('font-size', '10');
    text.setAttribute('font-weight', '500');
    text.setAttribute('fill', 'rgba(255,255,255,0.6)');
    text.setAttribute('letter-spacing', '1');
    text.textContent = CONTESTANTS[i];
    svg.appendChild(text);
  }

  // Outer ring
  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  ring.setAttribute('cx', CX);
  ring.setAttribute('cy', CY);
  ring.setAttribute('r', R);
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', 'rgba(0,180,255,0.25)');
  ring.setAttribute('stroke-width', '2');
  svg.appendChild(ring);
}

// ═══ SPIN LOGIC ═══

let hasSpun = false;

document.getElementById('spinBtn').addEventListener('click', spinWheel);

function spinWheel() {
  if (hasSpun) return;
  hasSpun = true;

  const btn = document.getElementById('spinBtn');
  const spinZone = document.getElementById('spinZone');
  btn.classList.add('hidden');

  const wheel = document.getElementById('wheel');
  const n = CONTESTANTS.length;
  const sliceAngle = 360 / n;

  // Find Caleb
  const winnerIndex = CONTESTANTS.indexOf(WINNER_NAME);
  const winnerCenter = winnerIndex * sliceAngle + sliceAngle / 2;

  // Calculate rotation
  const jitter = (Math.random() - 0.5) * sliceAngle * 0.3;
  const targetAngle = 360 - winnerCenter + jitter;
  const extraSpins = 12 + Math.floor(Math.random() * 5); // 12-16 spins
  const totalRotation = extraSpins * 360 + targetAngle;

  // Start spinning
  wheel.classList.add('spinning');
  wheel.style.transform = `rotate(${totalRotation}deg)`;

  // Pointer tick effect
  let ticks = 0;
  const pointer = document.querySelector('.pointer');
  const tickInterval = setInterval(() => {
    ticks++;
    const intensity = Math.max(0, 1 - ticks / 120);
    pointer.style.transform = `translateX(-50%) rotate(${(Math.random() - 0.5) * 4 * intensity}deg)`;
    if (ticks > 120) {
      clearInterval(tickInterval);
      pointer.style.transform = 'translateX(-50%)';
    }
  }, 50);

  // Reveal sequence
  setTimeout(() => {
    const container = document.getElementById('container');
    const flash = document.getElementById('flash');
    const winnerGlow = document.getElementById('winnerGlow');
    const winnerZone = document.getElementById('winnerZone');
    const winnerName = document.getElementById('winnerName');

    // Screen shake
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 500);

    // Flash burst
    flash.classList.add('flash');
    setTimeout(() => flash.classList.remove('flash'), 150);
    setTimeout(() => {
      flash.classList.add('flash');
      setTimeout(() => flash.classList.remove('flash'), 100);
    }, 200);
    setTimeout(() => {
      flash.classList.add('flash');
      setTimeout(() => flash.classList.remove('flash'), 80);
    }, 350);

    // Activate glow
    winnerGlow.classList.add('active');

    // Reveal winner
    setTimeout(() => {
      spinZone.style.display = 'none';
      winnerName.textContent = WINNER_NAME;
      winnerZone.classList.add('revealed');
      spawnParticles();
      spawnConfetti();
    }, 400);

  }, 8200);
}

function spawnParticles() {
  const container = document.getElementById('particles');
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 400;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--tx', tx + 'px');
    p.style.setProperty('--ty', ty + 'px');
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    const size = 3 + Math.random() * 8;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    const colors = ['#00B4FF', '#00D4FF', '#FFD700', '#FF6B6B', '#ffffff'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    container.appendChild(p);
    requestAnimationFrame(() => p.classList.add('active'));
  }
}

function spawnConfetti() {
  const container = document.getElementById('particles');
  const colors = ['#00B4FF', '#00D4FF', '#FFD700', '#FF6B6B', '#4ECDC4', '#fff', '#9B59B6'];

  for (let i = 0; i < 100; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = (Math.random() * 100) + 'vw';
    conf.style.top = '-20px';
    const size = 6 + Math.random() * 10;
    conf.style.width = size + 'px';
    conf.style.height = size * (0.4 + Math.random() * 0.6) + 'px';
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.setProperty('--delay', (Math.random() * 1.5) + 's');
    conf.style.setProperty('--duration', (2 + Math.random() * 2) + 's');
    conf.style.setProperty('--rotation', (360 + Math.random() * 720) + 'deg');
    container.appendChild(conf);
    requestAnimationFrame(() => conf.classList.add('active'));
  }
}

// Build wheel
buildWheel();

// AUTO-SPIN after 3 seconds for screen recording
setTimeout(() => {
  spinWheel();
}, 3000);
</script>
